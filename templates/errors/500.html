{% extends 'base.html' %}

{% load static %}

{% block content %}

<main>
    <!-- Hero Start-->
    <section class="hero_img position-relative">
        <img src="{% static 'img/owl/chains.jpg' %}" class="w-100 object-fit-cover" style="max-height: 400px; object-position: center;" alt="">
        <div class="overlay_img position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center bg-dark bg-opacity-50">
            <div class="fade-in-on-load text-center text-white">
                <h2 class="display-4 fw-bold">ERROR: 500</h2>
            </div>
        </div>
    </section>
    <!-- Hero End-->

    <div class="container-fluid">
        <div class="row">

            <div class="container animate-bounce">
                <div class="card-body text-center" style="margin-bottom: 50px; margin-top: 50px;">

                    <img class="lazy img-fluid pt-3" src="{% static 'img/custom_image/error_404.png' %}"
                         style="height: auto; max-width: 300px;"
                         oncontextmenu="return false;">

                    <h1 class="pt-3" style="font-weight: 900;"> Internal Server Error</h1>
                </div>
            </div>

        </div>
    </div>

</main>

{% endblock content %}
