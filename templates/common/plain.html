<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rasa Bot</title>
</head>
<body>

<!-- Rasa webchat script -->
<script>
    !(function () {
      let e = document.createElement("script"),
        t = document.head || document.getElementsByTagName("head")[0];
      e.src = "https://cdn.jsdelivr.net/npm/rasa-webchat/lib/index.js"; // latest tested version
      e.async = !0;
      e.onload = () => {
        window.WebChat.default(
          {
            initPayload: "/greet",  // optional: initial intent
            customData: { language: "en" },
            socketUrl: "http://localhost:5005",   // Rasa server
            socketPath: "/socket.io/",            // Rasa uses this
            title: "My Assistant",                // Widget title
            subtitle: "Ask me anything!",         // Widget subtitle
          },
          null
        );
      };
      t.insertBefore(e, t.firstChild);
    })();
</script>

</body>
</html>
